[project]
name = "escaneo"
version = "0.1.0"
description = "Multi-modal processor — simulated OCR, schema extraction and cross-validation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escaneo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
